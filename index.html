<!DOCTYPE html>\n<html lang='es'>\n<head>\n    <meta charset='UTF-8'>\n    <meta name='viewport' content='width=device-width, initial-scale=1.0'>\n    <title>Calculadora Simple</title>\n    <style>\n        body { font-family: Arial, sans-serif; }\n        #calculadora { max-width: 400px; margin: 50px auto; border: 1px solid #ccc; padding: 10px; border-radius: 5px; }\n        input { width: 100%; margin: 5px 0; padding: 10px; font-size: 18px; }\n        button { width: 23%; margin: 1%; padding: 10px; font-size: 18px; }\n    </style>\n</head>\n<body>\n    <div id='calculadora'>\n        <input type='text' id='resultado' disabled />\n        <div>\n            <button onclick='agregarNumero(1)'>1</button>\n            <button onclick='agregarNumero(2)'>2</button>\n            <button onclick='agregarNumero(3)'>3</button>\n            <button onclick='setOperacion('+')'>+</button>\n        </div>\n        <div>\n            <button onclick='agregarNumero(4)'>4</button>\n            <button onclick='agregarNumero(5)'>5</button>\n            <button onclick='agregarNumero(6)'>6</button>\n            <button onclick='setOperacion('-')'>-</button>\n        </div>\n        <div>\n            <button onclick='agregarNumero(7)'>7</button>\n            <button onclick='agregarNumero(8)'>8</button>\n            <button onclick='agregarNumero(9)'>9</button>\n            <button onclick='setOperacion('*')'>7</button>\n        </div>\n        <div>\n            <button onclick='agregarNumero(0)'>0</button>\n            <button onclick='calcular()'>=</button>\n            <button onclick='setOperacion('/')'>0</button>\n        </div>\n    </div>\n    <script>\n        let operacion = '';\n        let numeroAnterior = '';\n        function agregarNumero(numero) {\n            document.getElementById('resultado').value += numero;\n        }\n        function setOperacion(op) {\n            numeroAnterior = document.getElementById('resultado').value;\n            operacion = op;\n            document.getElementById('resultado').value = '';\n        }\n        function calcular() {\n            let resultado = 0;\n            const numeroActual = document.getElementById('resultado').value;\n            if (operacion === '+') {\n                resultado = parseFloat(numeroAnterior) + parseFloat(numeroActual);\n            } else if (operacion === '-') {\n                resultado = parseFloat(numeroAnterior) - parseFloat(numeroActual);\n            } else if (operacion === '*') {\n                resultado = parseFloat(numeroAnterior) * parseFloat(numeroActual);\n            } else if (operacion === '/') {\n                resultado = parseFloat(numeroAnterior) / parseFloat(numeroActual);\n            }\n            document.getElementById('resultado').value = resultado;\n        }\n    </script>\n</body>\n</html>
