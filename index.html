<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de contacto</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
      color: #1f2937;
    }
    .card {
      width: 100%;
      max-width: 520px;
      background: #ffffff;
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
    }
    h1 { font-size: 1.75rem; margin-bottom: 0.25rem; }
    .subtitle { color: #6b7280; margin-bottom: 1.5rem; }
    .field { margin-bottom: 1rem; }
    label { display: block; font-weight: 600; margin-bottom: 0.4rem; font-size: 0.95rem; }
    input, textarea {
      width: 100%;
      padding: 0.75rem 0.9rem;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }
    textarea { resize: vertical; min-height: 130px; }
    button {
      width: 100%;
      padding: 0.85rem;
      border: none;
      border-radius: 10px;
      background: #6366f1;
      color: #ffffff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #4f46e5; }
    .message { margin-bottom: 1rem; padding: 0.75rem 0.9rem; border-radius: 10px; display: none; }
    .message.error { display: block; background: #fee2e2; color: #b91c1c; }
    .message.success { display: block; background: #dcfce7; color: #15803d; }
    @media (max-width: 480px) {
      .card { padding: 1.25rem; border-radius: 12px; }
      h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Contacto</h1>
    <p class="subtitle">Completá el formulario y te responderemos a la brevedad.</p>
    <div id="mensaje-estado" class="message" role="alert"></div>
    <form id="form-contacto" novalidate>
      <div class="field">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" autocomplete="name">
      </div>
      <div class="field">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" autocomplete="email">
      </div>
      <div class="field">
        <label for="asunto">Asunto</label>
        <input type="text" id="asunto" name="asunto">
      </div>
      <div class="field">
        <label for="mensaje">Mensaje</label>
        <textarea id="mensaje" name="mensaje"></textarea>
      </div>
      <button type="submit">Enviar</button>
    </form>
  </main>
  <script>
    document.getElementById('form-contacto').addEventListener('submit', function (e) {
      e.preventDefault();
      var estado = document.getElementById('mensaje-estado');
      var campos = ['nombre', 'correo', 'asunto', 'mensaje'];
      var incompleto = campos.some(function (id) {
        return document.getElementById(id).value.trim() === '';
      });
      if (incompleto) {
        estado.className = 'message error';
        estado.textContent = 'Por favor completá todos los campos';
        return;
      }
      estado.className = 'message success';
      estado.textContent = '¡Gracias! Tu mensaje fue enviado.';
      this.reset();
    });
  </script>
</body>
</html>
